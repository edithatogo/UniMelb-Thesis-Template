name: LaTeX Compilation Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Set up TeX Live
        uses: xu-cheng/texlive-action@v2
        with:
          packages: scheme-full biber latexmk chktex latexindent

      - name: Lint LaTeX code
        run: |
          chktex --nowarn 3,18,36 example/*.tex template/*.sty template/*.cls || true

      - name: Format LaTeX code
        run: |
          latexindent -w -s -y example/*.tex template/*.sty template/*.cls || true

      - name: Compile LaTeX document
        run: |
          cd example
          latexmk -lualatex -interaction=nonstopmode -file-line-error Thesis.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: example/out/Thesis.pdf
          if-no-files-found: error
